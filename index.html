<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little League Roster Matrix Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 10px;
            color: #0f172a;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            background: #1e3a8a;
            color: white;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .header h1 { margin: 0; font-size: 18px; }
        .header p { margin: 4px 0 0 0; color: #93c5fd; font-size: 11px; }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        @media (min-width: 900px) {
            .layout-grid { grid-template-columns: 360px 1fr; }
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        h2 { margin-top: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }

        /* Actions Bar Layout */
        .actions-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        @media (min-width: 600px) {
            .actions-row {
                flex-direction: row;
                align-items: center;
            }
        }
        
        .date-picker-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }
        .date-picker-wrapper label {
            font-size: 11px;
            font-weight: bold;
            color: #475569;
            text-transform: uppercase;
        }
        .game-date-input {
            padding: 11px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            color: #0f172a;
            background: white;
            font-family: inherit;
        }
        .game-date-input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .btn-print {
            background: #2563eb;
            color: white;
            flex: 1;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            align-self: flex-end;
            width: 100%;
        }
        .btn-print:active { background: #1d4ed8; }

        @media (min-width: 600px) {
            .btn-print { width: auto; }
        }

        /* Attendance Checkbox Grid with dynamic input layout */
        .attendance-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
        }
        .player-checkbox-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 10px;
            border-radius: 6px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            user-select: none;
            font-size: 13px;
            gap: 10px;
        }
        .checkbox-left {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }
        .checkbox-left input[type="checkbox"] { 
            margin-right: 10px; 
            transform: scale(1.2); 
            cursor: pointer; 
            flex-shrink: 0;
        }
        .player-name-input {
            width: 100%;
            padding: 4px 8px;
            font-size: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            color: #0f172a;
            background: #fff;
        }
        .player-name-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }
        .player-note-input {
            width: 50px;
            padding: 4px 6px;
            font-size: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            color: #334155;
            background: white;
            text-align: center;
            flex-shrink: 0;
        }
        .player-note-input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .absent-style { color: #94a3b8; background: #f1f5f9; }
        .absent-style .player-note-input, .absent-style .player-name-input { 
            opacity: 0.5;
            background: #f1f5f9;
            text-decoration: line-through;
        }

        /* Shuffled Baseline View */
        .master-lineup-flex { display: flex; flex-wrap: wrap; gap: 6px; }
        .master-badge {
            background: #bae6fd;
            color: #0369a1;
            padding: 6px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
        }
        .master-badge.unavailable {
            background: #f1f5f9;
            color: #94a3b8;
            text-decoration: line-through;
        }
        .master-badge.unavailable .master-num {
            background: rgba(0,0,0,0.05);
            color: #94a3b8;
        }
        .master-badge.unavailable .master-note {
            color: #94a3b8;
        }
        .master-num { background: rgba(255,255,255,0.7); border-radius: 50%; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; margin-right: 5px; flex-shrink: 0; }
        .master-note { font-size: 10px; color: #0284c7; margin-left: 5px; font-weight: normal; opacity: 0.85; }

        /* Mobile Inning Tabs Selector */
        .tabs-container {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            scrollbar-width: none; 
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            background: #e2e8f0;
            color: #475569;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .tab-btn.active {
            background: #334155;
            color: white;
        }

        @media (min-width: 900px) {
            .tabs-container { display: none; } 
        }

        /* Inning Matrix Grid Layout */
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        
        .inning-column { 
            display: none; 
            background: #f8fafc; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            padding: 10px; 
        }
        .inning-column.active-mobile { 
            display: block; 
        }

        @media (min-width: 900px) {
            .chart-grid { grid-template-columns: repeat(6, minmax(150px, 1fr)); }
            .inning-column { display: block !important; }
        }

        .inning-header { text-align: center; background: #334155; color: white; padding: 6px; border-radius: 4px; font-weight: bold; margin-bottom: 12px; font-size: 13px; }
        
        .slot {
            background: white;
            border: 1px solid #e2e8f0;
            padding: 10px 8px; 
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }
        .slot-left { display: flex; align-items: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
        .slot-name-wrapper { display: flex; flex-direction: column; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .slot-note { font-size: 10px; color: #64748b; font-weight: normal; margin-top: 1px; }
        .slot-num {
            font-weight: bold;
            color: #475569;
            margin-right: 8px;
            background: #e2e8f0;
            min-width: 20px;
            height: 20px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }
        .pos-tag { 
            font-size: 11px; 
            font-weight: bold;
            color: #1e40af; 
            background: #dbeafe; 
            padding: 3px 7px; 
            border-radius: 4px; 
            min-width: 26px;
            text-align: center;
            flex-shrink: 0;
        }

        /* Batting Status Highlights */
        .will-bat { border-left: 4px solid #3b82f6; }
        .bench-slot { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
        .bench-slot .slot-num { background: #cbd5e1; color: #64748b; }
        .bench-slot .pos-tag { background: #e2e8f0; color: #64748b; }

        /* Leadoff Highlights */
        .leadoff-slot { background: #f0fdf4; border-color: #bbf7d0; font-weight: bold; color: #166534; border-left: 4px solid #22c55e; }
        .leadoff-slot .slot-num { background: #22c55e; color: white; }

        /* Print Styles Optimization */
        @media print {
            @page {
                size: landscape;
                margin: 0.4in;
            }
            body {
                background: white !important;
                color: #000 !important;
                padding: 0;
            }
            .layout-grid > div:first-child,
            .actions-row,
            .tabs-container {
                display: none !important;
            }
            .layout-grid {
                grid-template-columns: 1fr !important;
            }
            .card {
                box-shadow: none !important;
                padding: 0 !important;
                margin-bottom: 20px !important;
                border: none !important;
            }
            .header {
                background: #1e3a8a !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                margin-bottom: 20px !important;
            }
            .header p { color: #bfdbfe !important; }
            .chart-grid {
                display: grid !important;
                grid-template-columns: repeat(6, 1fr) !important;
                gap: 6px !important;
            }
            .inning-column {
                display: block !important;
                background: #fff !important;
                border: 1px solid #94a3b8 !important;
                padding: 6px !important;
            }
            .inning-header {
                background: #334155 !important;
                color: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                font-size: 12px !important;
                padding: 4px !important;
            }
            .slot {
                border: 1px solid #cbd5e1 !important;
                padding: 6px 4px !important;
                margin-bottom: 4px !important;
                font-size: 11px !important;
                background: #fff !important;
            }
            .slot-num {
                background: #f1f5f9 !important;
                color: #000 !important;
                border: 1px solid #cbd5e1 !important;
            }
            .pos-tag {
                background: #dbeafe !important;
                color: #1e40af !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                border: 1px solid #bfdbfe !important;
            }
            .will-bat {
                border-left: 4px solid #3b82f6 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .leadoff-slot {
                border-left: 4px solid #22c55e !important;
                background: #f0fdf4 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .leadoff-slot .slot-num {
                background: #22c55e !important;
                color: white !important;
            }
            .bench-slot {
                background: #f8fafc !important;
                color: #64748b !important;
            }
            .bench-slot .pos-tag {
                background: #f1f5f9 !important;
                color: #64748b !important;
                border: 1px solid #e2e8f0 !important;
            }
            .master-badge {
                background: #e0f2fe !important;
                color: #0369a1 !important;
                border: 1px solid #bae6fd !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .master-badge.unavailable {
                background: #f1f5f9 !important;
                color: #94a3b8 !important;
                border: 1px solid #cbd5e1 !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⚾ Little League Roster Matrix Tracker</h1>
        <p>Continuous Order Loop • Exactly 7 Batters Per Inning with Defensive Alignment</p>
    </div>

    <div class="layout-grid">
        <div class="card">
            <h2>Game Attendance & Roster</h2>
            <p style="font-size: 11px; color: #64748b; margin-top: 0; margin-bottom: 12px;">Uncheck if absent. Changes to names and numbers automatically save locally.</p>
            <div id="attendanceBox" class="attendance-list"></div>
        </div>

        <div>
            <div class="actions-row">
                <div class="date-picker-wrapper">
                    <label for="gameDate">Select Game Date</label>
                    <input type="date" id="gameDate" class="game-date-input" onchange="generateGameLineupChart()">
                </div>
                <button class="btn btn-print" onclick="window.print()">🖨️ Print Lineup / PDF</button>
            </div>
            
            <div class="card">
                <h2 id="masterLineupHeading">Today's Master Batting Order</h2>
                <div id="masterLineupBar" class="master-lineup-flex"></div>
            </div>

            <div class="card">
                <h2>6-Inning Game Matrix (All Players Tracked)</h2>
                
                <div class="tabs-container" id="tabsBar">
                    <button class="tab-btn active" onclick="switchMobileInning(1)">1st</button>
                    <button class="tab-btn" onclick="switchMobileInning(2)">2nd</button>
                    <button class="tab-btn" onclick="switchMobileInning(3)">3rd</button>
                    <button class="tab-btn" onclick="switchMobileInning(4)">4th</button>
                    <button class="tab-btn" onclick="switchMobileInning(5)">5th</button>
                    <button class="tab-btn" onclick="switchMobileInning(6)">6th</button>
                </div>

                <div class="chart-scroll-wrapper">
                    <div id="chartGrid" class="chart-grid"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const defaultRoster = [
        "1 Stephen Di Benedetto",
        "2 Nico Sabatello",
        "3 Miles Broeker",
        "4 John Hanson",
        "5 Liam Knapik",
        "6 Holden McQuillan",
        "7 Rylan Romanowski",
        "8 Javier Sweeney",
        "9 Christopher Chen",
        "10 Christian Orlowski",
        "11 Easton Smith"
    ];

    const defensePositions = {
        1: "P", 2: "C", 3: "1B", 4: "2B", 5: "3B", 6: "SS", 7: "LF", 8: "CF", 9: "RF"
    };

    let activeMobileInningIndex = 1;
    const totalExtraRows = 3;
    const totalRowsCount = defaultRoster.length + totalExtraRows;

    // Set default date picker value to today's local date
    function setDefaultDate() {
        const dateInput = document.getElementById('gameDate');
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        dateInput.value = `${yyyy}-${mm}-${dd}`;
    }

    // Simple hash-based seedable pseudo-random number generator (Mulberry32 variant)
    function seedableRandom(seedString) {
        let hash = 0;
        for (let i = 0; i < seedString.length; i++) {
            hash = seedString.charCodeAt(i) + ((hash << 5) - hash);
        }
        return function() {
            let t = hash += 0x6D2B79F5;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    function loadSavedRosterData() {
        const savedData = localStorage.getItem('rosterMatrixTrackerData');
        if (savedData) {
            try {
                return JSON.parse(savedData);
            } catch (e) {
                console.error("Error parsing saved roster data, reverting to defaults.", e);
            }
        }
        
        let initialData = [];
        defaultRoster.forEach(name => {
            initialData.push({ name: name, note: "", checked: true });
        });
        for (let i = 0; i < totalExtraRows; i++) {
            initialData.push({ name: "", note: "", checked: true });
        }
        return initialData;
    }

    function saveRosterToLocalStorage() {
        let currentData = [];
        for (let i = 0; i < totalRowsCount; i++) {
            const isChecked = document.getElementById(`p-${i}`).checked;
            const nameValue = document.getElementById(`name-${i}`).value;
            const noteValue = document.getElementById(`note-${i}`).value;
            
            currentData.push({
                name: nameValue,
                note: noteValue,
                checked: isChecked
            });
        }
        localStorage.setItem('rosterMatrixTrackerData', JSON.stringify(currentData));
    }

    function buildAttendanceList() {
        const box = document.getElementById('attendanceBox');
        box.innerHTML = '';
        
        const currentRosterState = loadSavedRosterData();

        for (let i = 0; i < totalRowsCount; i++) {
            const playerData = currentRosterState[i] || { name: "", note: "", checked: true };
            const row = document.createElement('div');
            row.className = 'player-checkbox-row' + (playerData.checked ? '' : ' absent-style');
            row.id = `row-${i}`;
            
            const placeholderText = i >= defaultRoster.length ? `Add Player #${i - defaultRoster.length + 1}...` : '';

            row.innerHTML = `
                <div class="checkbox-left">
                    <input type="checkbox" id="p-${i}" ${playerData.checked ? 'checked' : ''} onchange="toggleRowStyle(${i}); saveRosterToLocalStorage(); generateGameLineupChart();">
                    <input type="text" id="name-${i}" class="player-name-input" value="${playerData.name}" placeholder="${placeholderText}" oninput="saveRosterToLocalStorage(); generateGameLineupChart();">
                </div>
                <input type="text" id="note-${i}" class="player-note-input" value="${playerData.note}" placeholder="#" title="Jersey number or details" oninput="saveRosterToLocalStorage(); generateGameLineupChart();">
            `;
            box.appendChild(row);
        }
    }

    function toggleRowStyle(index) {
        const row = document.getElementById(`row-${index}`);
        const checkbox = document.getElementById(`p-${index}`);
        if (checkbox.checked) {
            row.classList.remove('absent-style');
        } else {
            row.classList.add('absent-style');
        }
    }

    function switchMobileInning(inningNum) {
        activeMobileInningIndex = inningNum;
        
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach((tab, idx) => {
            if ((idx + 1) === inningNum) {
                tab.classList.add('active');
            } else {
                tab.classList.remove('active');
            }
        });

        const columns = document.querySelectorAll('.inning-column');
        columns.forEach((col, idx) => {
            if ((idx + 1) === inningNum) {
                col.classList.add('active-mobile');
            } else {
                col.classList.remove('active-mobile');
            }
        });
    }

    function generateGameLineupChart() {
        const bar = document.getElementById('masterLineupBar');
        const grid = document.getElementById('chartGrid');
        const heading = document.getElementById('masterLineupHeading');
        
        bar.innerHTML = '';
        grid.innerHTML = '';

        // Update Heading to show Selected Game Date
        const selectedDate = document.getElementById('gameDate').value || "default-seed";
        heading.innerText = `Today's Master Batting Order (Game Date: ${selectedDate})`;

        let activePlayers = [];
        let unavailablePlayers = [];

        for (let index = 0; index < totalRowsCount; index++) {
            const nameInput = document.getElementById(`name-${index}`);
            const playerName = nameInput ? nameInput.value.trim() : "";
            
            if (playerName !== "") {
                const noteValue = document.getElementById(`note-${index}`).value.trim();
                const isPresent = document.getElementById(`p-${index}`).checked;
                
                if (isPresent) {
                    activePlayers.push({ name: playerName, note: noteValue });
                } else {
                    unavailablePlayers.push({ name: playerName, note: noteValue });
                }
            }
        }

        if (activePlayers.length === 0 && unavailablePlayers.length === 0) {
            grid.innerHTML = '<p style="text-align:center; color:#ef4444; font-style:italic; padding: 20px;">No players are selected or named!</p>';
            return;
        }

        // Fetch seed and execute Fisher-Yates Shuffle Lineup Sequence
        const nextRandom = seedableRandom(selectedDate);
        let todayLoop = [...activePlayers];
        for (let i = todayLoop.length - 1; i > 0; i--) {
            const j = Math.floor(nextRandom() * (i + 1));
            [todayLoop[i], todayLoop[j]] = [todayLoop[j], todayLoop[i]];
        }

        // Render Active Layout Sequence
        todayLoop.forEach((player, index) => {
            const badge = document.createElement('div');
            badge.className = 'master-badge';
            let noteSpan = player.note ? `<span class="master-note">(${player.note})</span>` : '';
            badge.innerHTML = `<span class="master-num">${index + 1}</span>${player.name}${noteSpan}`;
            bar.appendChild(badge);
        });

        // Append Unavailable Players with Strikethrough at the End
        unavailablePlayers.forEach((player) => {
            const badge = document.createElement('div');
            badge.className = 'master-badge unavailable';
            let noteSpan = player.note ? `<span class="master-note">(${player.note})</span>` : '';
            badge.innerHTML = `<span class="master-num">X</span>${player.name}${noteSpan}`;
            bar.appendChild(badge);
        });

        if (activePlayers.length === 0) {
            grid.innerHTML = '<p style="text-align:center; color:#ef4444; font-style:italic; padding: 20px;">No active players to calculate matrix lanes!</p>';
            return;
        }

        // Construct 6-Inning Field Matrix
        const BATTERS_PER_INNING = 7; 
        let globalLineupPointer = 0; 

        for (let inning = 1; inning <= 6; inning++) {
            const column = document.createElement('div');
            const activeClass = (inning === activeMobileInningIndex) ? 'active-mobile' : '';
            column.className = `inning-column ${activeClass}`;
            column.innerHTML = `<div class="inning-header">Inning ${inning}</div>`;

            let inningRosterLayout = [];

            for (let i = 0; i < todayLoop.length; i++) {
                let relativePosition = (i - globalLineupPointer + todayLoop.length) % todayLoop.length;
                let inningOrderNumber = relativePosition + 1; 

                let isHittingThisInning = (inningOrderNumber <= BATTERS_PER_INNING);
                let isDefending = inningOrderNumber <= 9;
                let positionLabel = isDefending ? defensePositions[inningOrderNumber] : "BN";

                inningRosterLayout.push({
                    name: todayLoop[i].name,
                    note: todayLoop[i].note,
                    orderNum: inningOrderNumber,
                    position: positionLabel,
                    isLeadoff: (inningOrderNumber === 1),
                    willBat: isHittingThisInning,
                    isBench: !isDefending
                });
            }

            inningRosterLayout.sort((a, b) => a.orderNum - b.orderNum);

            inningRosterLayout.forEach((player) => {
                const slot = document.createElement('div');
                let slotClass = 'slot';
                if (player.isLeadoff) slotClass += ' leadoff-slot';
                else if (player.willBat) slotClass += ' will-bat';
                if (player.isBench) slotClass += ' bench-slot';
                
                slot.className = slotClass;
                
                let noteDiv = player.note ? `<span class="slot-note">${player.note}</span>` : '';
                
                slot.innerHTML = `
                    <div class="slot-left">
                        <span class="slot-num">${player.orderNum}</span>
                        <div class="slot-name-wrapper">
                            <span>${player.name}</span>
                            ${noteDiv}
                        </div>
                    </div>
                    <span class="pos-tag">${player.position}</span>
                `;
                column.appendChild(slot);
            });

            grid.appendChild(column);
            globalLineupPointer = (globalLineupPointer + BATTERS_PER_INNING) % todayLoop.length;
        }
    }

    // Initialize application settings
